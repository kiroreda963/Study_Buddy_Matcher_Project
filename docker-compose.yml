services:
  kafka:
    image: apache/kafka:3.7.2
    restart: unless-stopped
    container_name: kafka
    ports:
      - "9093:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  user-auth-service:
    build:
      context: ./backend/services/user-auth-service
      dockerfile: Dockerfile
    restart: unless-stopped
    container_name: user-auth-service
    ports:
      - "3001:3001"
    env_file:
      - ./backend/services/user-auth-service/.env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  session-service:
    build:
      context: ./backend/services/session-service
      dockerfile: Dockerfile
    container_name: session-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ./backend/services/session-service/.env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  profile-preferences-service:
    build:
      context: ./backend/services/profile-preferences-service
      dockerfile: Dockerfile
    container_name: profile-preferences-service
    restart: unless-stopped
    ports:
      - "3003:3003"
    env_file:
      - ./backend/services/profile-preferences-service/.env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  notification-service:
    build:
      context: ./backend/services/notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    restart: unless-stopped
    ports:
      - "3004:3004"
    env_file:
      - ./backend/services/notification-service/.env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  matching-service-service:
    build:
      context: ./backend/services/matching-service
      dockerfile: Dockerfile
    container_name: matching-service-service
    restart: unless-stopped
    ports:
      - "3005:3005"
    env_file:
      - ./backend/services/matching-service/.env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  availability-service:
    build:
      context: ./backend/services/availability-service
      dockerfile: Dockerfile
    container_name: availability-service
    restart: unless-stopped
    ports:
      - "3006:3006"
    env_file:
      - ./backend/services/availability-service/.env
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_HOST: ${VITE_API_HOST}
        VITE_AUTH_API_URI: ${VITE_AUTH_API_URI} 
        VITE_PROFILE_API_URI: ${VITE_PROFILE_API_URI}
        VITE_AVAILABILITY_API_URI: ${VITE_AVAILABILITY_API_URI}
        VITE_NOTIFICATION_API_URI: ${VITE_NOTIFICATION_API_URI}
        VITE_SESSION_API_URI: ${VITE_SESSION_API_URI}
        VITE_MATCHING_API_URI: ${VITE_MATCHING_API_URI}

    restart: unless-stopped

    ports:
      - "3000:80"
volumes:
  kafka_data: